version: "3.9"

services:
  mariadb:
    image: mariadb:10.11
    container_name: mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: QPUfC`1v&;@F9.`iL16
      MYSQL_DATABASE: BD_ARCAN
      MYSQL_USER: arcan_user
      MYSQL_PASSWORD: 2D%71[w6%o7^uO!#G
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - backend_net

  backend:
    build: ./backend
    container_name: backend
    restart: always
    depends_on:
      - mariadb
    networks:
      - backend_net

  frontend:
    build: ./frontend
    container_name: frontend
    restart: always
    networks:
      - backend_net

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - backend_net

  adminer:
    image: adminer
    container_name: adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - mariadb
    networks:
      - backend_net

volumes:
  mariadb_data:

networks:
  backend_net:
    driver: bridge
