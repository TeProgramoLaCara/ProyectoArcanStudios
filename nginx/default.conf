server {
    listen 80;
    server_name reservas.arcanstudios.com;

    # Redirección automática de todo el tráfico HTTP a HTTPS seguro
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name reservas.arcanstudios.com;

    # Certificados SSL de Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/reservas.arcanstudios.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reservas.arcanstudios.com/privkey.pem;

    # Configuraciones de seguridad SSL recomendadas
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # FRONTEND PROXY API (Next.js)
    # Redirige las llamadas al backend a través del servidor Next.js
    location /api/backend/ {
        proxy_pass http://frontend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # BACKEND DIRECT (NestJS - Swagger y API directa)
    location /api {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FRONTEND (Next.js)
    location / {
        proxy_pass http://frontend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
